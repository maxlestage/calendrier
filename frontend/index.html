<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calendrier" />
    <title>Calendrier</title>
    <!-- Splash styles are inline so the screen paints on the very first frame,
         before the stylesheet or the app bundle have loaded. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        /* Brushed steel, same ramp as the app icon */
        background: linear-gradient(
          135deg,
          #454e59 0%,
          #252b32 28%,
          #616c78 52%,
          #272d34 74%,
          #171b1f 100%
        );
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        width: 116px;
        height: 116px;
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        animation: splash-in 0.5s ease-out both;
      }
      #splash .name {
        margin-top: 22px;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #fff;
        animation: splash-in 0.5s ease-out both;
      }
      #splash .track {
        position: relative;
        width: 150px;
        height: 4px;
        margin-top: 26px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        animation: splash-in 0.5s ease-out both;
      }
      #splash .track::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        animation: splash-sweep 1.3s linear infinite;
      }
      #splash .credit {
        position: absolute;
        bottom: calc(40px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        animation: splash-in 0.6s ease-out both;
      }
      #splash .credit small {
        display: block;
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.55);
      }
      #splash .credit strong {
        display: block;
        margin-top: 3px;
        font-size: 0.95rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
      }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-sweep {
        from { transform: translateX(-115px); }
        to   { transform: translateX(150px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .logo,
        #splash .name,
        #splash .track,
        #splash .credit { animation: none; }
        #splash .track::after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img class="logo" src="/icon-192.png" alt="" width="116" height="116" />
      <div class="name">Calendrier</div>
      <div class="track"></div>
      <div class="credit">
        <small>Créé et développé par</small>
        <strong>Maxime Nathan Lestage</strong>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
